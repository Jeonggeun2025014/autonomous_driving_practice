<!DOCTYPE html>
<html>
<head>
    <title>Robot Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            margin-top: 30px;
        }

        .controller {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 22px;
            border-radius: 20px;
            border: none;
            background-color: #333;
            color: white;
        }

        button:active {
            background-color: #777;
        }

        .forward {
            grid-column: 2;
            grid-row: 1;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .stop {
            grid-column: 2;
            grid-row: 2;
            background-color: red;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        .backward {
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>

<body>
    <h1>Robot Controller</h1>

    <div class="controller">
        <button class="forward" onclick="sendCommand('/forward')">▲</button>
        <button class="left" onclick="sendCommand('/left')">◀</button>
        <button class="stop" onclick="sendCommand('/stop')">STOP</button>
        <button class="right" onclick="sendCommand('/right')">▶</button>
        <button class="backward" onclick="sendCommand('/backward')">▼</button>
    </div>

    <script>
        const ROBOT_IP = "10.248.102.169";
        const PORT = "5000";

        function sendCommand(command) {
            fetch(`http://${ROBOT_IP}:${PORT}${command}`)
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
